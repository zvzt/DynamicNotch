name: Checks

on:
  push:
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check shell syntax
        run: |
          bash -n install.sh
          bash -n uninstall.sh
      - name: Validate Info.plist
        run: plutil -lint Info.plist
      - name: Type-check Swift source
        run: swiftc -typecheck -framework Cocoa -framework SwiftUI -framework ServiceManagement DynamicNotch.swift
      - name: Compile DynamicNotch
        run: |
          swiftc -O -framework Cocoa -framework SwiftUI -framework ServiceManagement -o "$RUNNER_TEMP/DynamicNotch" DynamicNotch.swift
          test -x "$RUNNER_TEMP/DynamicNotch"
          file "$RUNNER_TEMP/DynamicNotch"
