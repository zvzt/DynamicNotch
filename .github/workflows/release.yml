name: Build and Publish Release

on:
  push:
    branches: [main]
    paths:
      - DynamicNotch.swift
      - Info.plist
      - DynamicNotch.command
      - RELEASE_NOTES.md
      - firefox/**
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      VERSION: 3.5.0
    steps:
      - uses: actions/checkout@v4

      - name: Install media helper
        run: brew install media-control

      - name: Build DynamicNotch.app
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/build/DynamicNotch.app"
          CONTENTS="$APP/Contents"
          MACOS="$CONTENTS/MacOS"
          RESOURCES="$CONTENTS/Resources"
          mkdir -p "$MACOS" "$RESOURCES/firefox-extension"

          swiftc -O \
            -framework Cocoa \
            -framework SwiftUI \
            -framework ServiceManagement \
            -o "$MACOS/DynamicNotch" \
            DynamicNotch.swift

          cp Info.plist "$CONTENTS/Info.plist"
          cp firefox/manifest.json firefox/background.js firefox/content.js "$RESOURCES/firefox-extension/"
          cp firefox/firefox_host.pl "$RESOURCES/firefox_host.pl"
          cp firefox/Install-Firefox-Bridge.command "$RESOURCES/Install-Firefox-Bridge.command"
          chmod +x "$MACOS/DynamicNotch" "$RESOURCES/firefox_host.pl" "$RESOURCES/Install-Firefox-Bridge.command"

          HELPER_PREFIX="$(brew --prefix media-control)"
          mkdir -p "$RESOURCES/media-control"
          ditto "$HELPER_PREFIX" "$RESOURCES/media-control"

          codesign --force --deep --sign - "$APP"

      - name: Create DMG
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist dmg-root
          ditto build/DynamicNotch.app dmg-root/DynamicNotch.app
          ln -s /Applications dmg-root/Applications
          cp DynamicNotch.command dmg-root/DynamicNotch.command
          cp firefox/Install-Firefox-Bridge.command dmg-root/Install-Firefox-Bridge.command
          cat > dmg-root/README.txt <<'TXT'
          DynamicNotch

          Drag DynamicNotch.app to Applications.

          If macOS blocks first launch because this public build is not notarized,
          Control-click DynamicNotch.app and choose Open.

          Optional Firefox bridge:
          run Install-Firefox-Bridge.command after installing the app.

          Support:
          https://zxt.lol
          Discord: 1531412914005606513
          Email: contact@zxt.lol
          TXT
          hdiutil create \
            -volname DynamicNotch \
            -srcfolder dmg-root \
            -ov \
            -format UDZO \
            dist/DynamicNotch.dmg
          cp DynamicNotch.command dist/DynamicNotch.command

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: DynamicNotch-${{ env.VERSION }}
          path: |
            dist/DynamicNotch.dmg
            dist/DynamicNotch.command

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          gh release delete "$TAG" --yes --cleanup-tag >/dev/null 2>&1 || true
          git push origin ":refs/tags/$TAG" >/dev/null 2>&1 || true
          gh release create "$TAG" \
            dist/DynamicNotch.dmg \
            dist/DynamicNotch.command \
            --target "$GITHUB_SHA" \
            --title "DynamicNotch $VERSION" \
            --notes-file RELEASE_NOTES.md \
            --latest